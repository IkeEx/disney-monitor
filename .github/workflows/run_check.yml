name: Miracosta Monitor

on:
  schedule:
    # 日本時間 毎日正午に実行
    - cron: '0 3 * * *'
  workflow_dispatch: 

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # pipの依存関係をキャッシュして高速化

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          # chromiumのみをインストールし、依存OSライブラリも入れる
          npx playwright install --with-deps chromium

      - name: Run Monitor
        env:
          URL_MIRA: ${{ secrets.URL_MIRA }}
          URL_FS: ${{ secrets.URL_FS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py

      - name: Success Notification
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" -X POST -d '{"content": "🚀 ミラコスタ監視：正常に実行されました（正午定期実行）"}' $DISCORD_WEBHOOK_URL

      - name: Failure Notification
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" -X POST -d '{"content": "⚠️ ミラコスタ監視：エラーが発生しました。ログを確認してください。"}' $DISCORD_WEBHOOK_URL
