name: Miracosta Monitor

on:
  schedule:
    # 日本時間 毎日正午に実行 (UTC 03:00)
    - cron: '0 3 * * *'
  workflow_dispatch: # 手動実行ボタン

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # エラーの原因となった cache: 'pip' を削除しました

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          # ブラウザ本体と、Linux実行に必要な依存ライブラリをインストール
          npx playwright install --with-deps chromium

      - name: Run Monitor
        env:
          URL_MIRA: ${{ secrets.URL_MIRA }}
          URL_FS: ${{ secrets.URL_FS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py

      - name: Success Notification
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" -X POST -d '{"content": "✅ ミラコスタ監視：正常に実行を完了しました。"}' $DISCORD_WEBHOOK_URL

      - name: Failure Notification
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" -X POST -d '{"content": "⚠️ ミラコスタ監視：実行中にエラーが発生しました。GitHub Actionsのログを確認してください。"}' $DISCORD_WEBHOOK_URL
